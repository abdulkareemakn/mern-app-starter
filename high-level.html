<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERN starter high-level stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75;
      --accent: #eb6c36;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { background: var(--paper); color: var(--ink); min-height: 100vh; padding: 48px 32px; }
    .frame { max-width: 1200px; margin: 0 auto; }
    .eyebrow { color: var(--muted); font: 500 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; margin-bottom: 8px; }
    h1 { color: var(--ink); font: 400 clamp(28px, 3vw, 36px)/1.15 var(--serif); letter-spacing: -.02em; margin-bottom: 24px; }
    svg { display: block; width: 100%; min-width: 900px; }
    .small, .tag, .sub, .label { fill: var(--muted); font-family: var(--mono); }
    .small { font-size: 8px; }
    .tag { font-size: 7px; font-weight: 500; letter-spacing: .08em; }
    .name { fill: var(--ink); font: 600 11px var(--sans); }
    .sub { font-size: 8px; }
    .label { font-size: 8px; letter-spacing: .06em; }
    .legend { fill: var(--muted); font: 400 9px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">High-level · MERN starter</p>
    <h1>The complete request stack, from browser to delivery</h1>
    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="high-level-title high-level-desc">
      <title id="high-level-title">MERN starter high-level stack</title>
      <desc id="high-level-desc">High-level stack showing the browser entering the React client, Express server, MongoDB persistence, and local or production email delivery inside the application runtime.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <polygon points="0,4 238,4 250,18 238,32 0,32" fill="#2d3142"/>
      <polygon points="250,4 488,4 500,18 488,32 250,32 262,18" fill="#3d4460"/>
      <polygon points="500,4 738,4 750,18 738,32 500,32 512,18" fill="#2d3142"/>
      <polygon points="750,4 1000,4 1000,32 750,32 762,18" fill="#3d4460"/>
      <text x="125" y="21" fill="#f5f5f5" class="small" text-anchor="middle" letter-spacing=".14em">EXTERNAL</text>
      <text x="375" y="21" fill="#f5f5f5" class="small" text-anchor="middle" letter-spacing=".14em">CLIENT</text>
      <text x="625" y="21" fill="#f5f5f5" class="small" text-anchor="middle" letter-spacing=".14em">SERVER</text>
      <text x="875" y="21" fill="#f5f5f5" class="small" text-anchor="middle" letter-spacing=".14em">DATA + DELIVERY</text>

      <rect x="4" y="40" width="242" height="336" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="6,3"/>
      <rect x="16" y="44" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="70" y="53" class="label" text-anchor="middle">OUTSIDE RUNTIME</text>
      <rect x="254" y="40" width="742" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.18)" stroke-width="1.2"/>

      <rect x="266" y="52" width="718" height="44" rx="4" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.18)" stroke-width="0.8"/>
      <text x="625" y="71" class="name" text-anchor="middle">Node.js 24 runtime</text>
      <text x="625" y="84" class="sub" text-anchor="middle">Vite dev proxy · Express production server · Docker Compose</text>

      <path d="M 242,192 H 262 Q 270,192 270,184 V 168 Q 270,160 278,160 H 299" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="246" y="136" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="145" class="label" text-anchor="middle">HTTPS</text>

      <line x1="451" y1="160" x2="549" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="462" y="132" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="141" class="label" text-anchor="middle">SAME-ORIGIN /API</text>

      <line x1="701" y1="160" x2="799" y2="160" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="712" y="132" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="740" y="141" class="label" text-anchor="middle">MONGOOSE</text>

      <path d="M 701,176 H 733 Q 741,176 741,184 V 208 Q 741,216 749,216 H 799" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="704" y="148" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="726" y="157" class="label" text-anchor="middle">MAIL</text>

      <rect x="8" y="160" width="234" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="8" y="160" width="234" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="16" y="166" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.45)" stroke-width="0.8"/>
      <text x="30" y="175" class="tag" text-anchor="middle">EXT</text>
      <text x="125" y="202" class="name" text-anchor="middle">Browser</text>
      <text x="125" y="214" class="sub" text-anchor="middle">user session · HTTPS</text>

      <rect x="299" y="120" width="152" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="299" y="120" width="152" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="307" y="126" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="321" y="135" class="tag" text-anchor="middle">UI</text>
      <text x="375" y="164" class="name" text-anchor="middle">React client</text>
      <text x="375" y="176" class="sub" text-anchor="middle">Vite · routes · forms</text>

      <rect x="549" y="120" width="152" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="549" y="120" width="152" height="80" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <rect x="557" y="126" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="575" y="135" class="tag" text-anchor="middle">API</text>
      <text x="625" y="164" class="name" text-anchor="middle">Express server</text>
      <text x="625" y="176" class="sub" text-anchor="middle">Better Auth · Zod · middleware</text>

      <rect x="799" y="120" width="152" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="799" y="120" width="152" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="807" y="126" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
      <text x="827" y="135" fill="rgba(235,108,54,0.85)" class="tag" text-anchor="middle">STORE</text>
      <text x="875" y="164" fill="#eb6c36" class="name" text-anchor="middle">MongoDB 8</text>
      <text x="875" y="176" fill="#eb6c36" class="sub" text-anchor="middle">persistent auth + app data</text>

      <rect x="799" y="216" width="152" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="799" y="216" width="152" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="807" y="222" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <text x="825" y="231" class="tag" text-anchor="middle">MAIL</text>
      <text x="875" y="260" class="name" text-anchor="middle">Email adapters</text>
      <text x="875" y="272" class="sub" text-anchor="middle">MailDev 3025 · Resend</text>

      <rect x="4" y="388" width="992" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="500" y="404" class="name" text-anchor="middle">Configuration boundary</text>
      <text x="500" y="416" class="sub" text-anchor="middle">validated environment · same APP_URL and BETTER_AUTH_URL · no browser secrets</text>
      <rect x="4" y="432" width="992" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="500" y="448" class="name" text-anchor="middle">Authentication boundary</text>
      <text x="500" y="460" class="sub" text-anchor="middle">session cookies · protected API middleware · database-backed rate limiting</text>

      <line x1="40" y1="504" x2="960" y2="504" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="526" class="label" letter-spacing=".14em">LEGEND</text>
      <rect x="40" y="536" width="20" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="68" y="546" class="legend">focal persistent store</text>
      <rect x="224" y="536" width="20" height="12" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="252" y="546" class="legend">local or external delivery</text>
      <line x1="448" y1="542" x2="468" y2="542" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="476" y="546" class="legend">request path</text>
      <line x1="632" y1="542" x2="652" y2="542" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="660" y="546" class="legend">secondary integration</text>
    </svg>
  </main>
</body>
</html>
